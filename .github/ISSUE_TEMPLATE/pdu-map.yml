name: PDU map
description: A PDU scan of your boiler (made by the integration's "Report PDU map" button) - helps to map more registers.
title: "PDU map: "
body:
  - type: markdown
    attributes:
      value: |
        Thanks! This report was prepared by **Scan PDUs** / **Report PDU map** (Dominus device → Diagnostic).
        It holds only PDU numbers and values - no host, MAC or password. Check it and press *Create*.
        A PDU the boiler does not provide usually reads 0, so the zeros are listed separately.
  - type: input
    id: model
    attributes:
      label: Boiler model
      description: e.g. Magis Pro 6 ErP + Victrix Tera 24 (as on the rating plate)
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Integration version
  - type: input
    id: range
    attributes:
      label: Scanned range
  - type: textarea
    id: map
    attributes:
      label: PDU map
      render: text
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: What was the boiler doing during the scan (heating, DHW, standby, a fault)? Anything you changed on the panel?
